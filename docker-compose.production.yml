services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
  studio:
    build:
      context: .
      dockerfile: apps/studio/Dockerfile
    ports: ["3001:3001"]
  mcp-host:
    build:
      context: .
      dockerfile: apps/mcp-host/Dockerfile
    ports: ["3002:3002"]
  blender-worker:
    build:
      context: .
      dockerfile: services/blender-worker/Dockerfile
    ports: ["8080:8080"]
    environment:
      PORT: 8080
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: kupuri_oma
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/neo4jpassword
    ports: ["7474:7474","7687:7687"]
